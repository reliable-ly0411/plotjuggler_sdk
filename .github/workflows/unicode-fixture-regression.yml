name: Windows Unicode fixture regression
on:
  push:
    branches: [fix/windows-unicode-build-fixture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unicode:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install isolated official Conan client
        shell: pwsh
        run: python -m pip install conan==2.22.2
      - name: Build and run two real Unicode tests
        shell: pwsh
        run: python tools/validation/windows_unicode.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-unicode-evidence
          path: ${{ runner.temp }}/sdk-unicode-evidence
          if-no-files-found: error
